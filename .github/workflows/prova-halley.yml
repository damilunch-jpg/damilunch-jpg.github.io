name: Prova collegamento Halley

on:
  push:
    paths:
      - .github/workflows/prova-halley.yml
    branches: [main]

jobs:
  prova:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Prova una scheda
        shell: pwsh
        run: |
          @'
          import urllib.request
          url = "https://www.halleyweb.com/c059028/mc/mc_p_dettaglio.php?id_pubbl=27021"
          try:
              with urllib.request.urlopen(url, timeout=25) as res:
                  html = res.read(200000)
                  print("SCHEDA", res.status, len(html), b"mc_attachment" in html)
          except Exception as exc:
              print("SCHEDA_ERRORE", type(exc).__name__, exc)
          '@ | Set-Content -Encoding utf8 prova.py
          python prova.py
