name: Prova Halley Windows

on:
  push:
    paths:
      - .github/workflows/prova-halley.yml
    branches: [main]

jobs:
  prova:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Confronta i due handshake
        shell: python
        run: |
          import ssl, urllib.request
          url = "https://www.halleyweb.com/c059028/mc/mc_p_dettaglio.php?id_pubbl=27021"
          def prova(nome, ctx):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=25, context=ctx) as res:
                      html = res.read(120000)
                      print(nome, "OK", res.status, len(html), b"mc_attachment" in html)
              except Exception as exc:
                  print(nome, "ERRORE", type(exc).__name__, exc)
          base = ssl.create_default_context()
          prova("default", base)
          sec = ssl.create_default_context()
          try:
              sec.set_ciphers("DEFAULT@SECLEVEL=1")
              prova("seclevel1", sec)
          except Exception as exc:
              print("seclevel1", "SETUP", type(exc).__name__, exc)
