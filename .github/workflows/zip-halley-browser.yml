name: Zip Halley con Chrome

on:
  push:
    paths:
      - .github/workflows/zip-halley-browser.yml
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-halley-browser
  cancel-in-progress: false

jobs:
  documenti:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Chrome per i PDF Halley
        run: |
          python3 -m pip install --user --disable-pip-version-check playwright
          google-chrome --version
          python3 -c "import playwright; print('playwright ok')"
      - name: Prepara lo zip degli atti nuovi
        run: python3 scripts/pacchetto_albo.py
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pubblica_release_albo.py
