name: Zip Halley con Chrome

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-halley-browser
  cancel-in-progress: false

jobs:
  documenti:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Chrome per i PDF Halley
        run: |
          python3 -m pip install --user --disable-pip-version-check playwright
          google-chrome --version
          python3 -c "import playwright; print('playwright ok')"
      - name: Prepara lo zip degli atti nuovi
        run: python3 scripts/pacchetto_albo.py
      - name: Conserva zip e PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albo-zip-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/documenti/
          retention-days: 7
          if-no-files-found: warn
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pubblica_release_albo.py || python3 scripts/pubblica_release_albo.py
