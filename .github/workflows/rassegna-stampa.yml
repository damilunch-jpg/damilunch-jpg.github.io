name: Rassegna stampa locale

on:
  schedule:
    # Ogni ora al minuto 17, così non parte insieme agli altri cron allo scoccare dell'ora.
    - cron: "17 * * * *"
  workflow_dispatch:
  # Un solo giro immediato: il trigger di push si toglie nel commit successivo.
  push:
    paths:
      - .github/workflows/rassegna-stampa.yml
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rassegna-stampa
  cancel-in-progress: false

jobs:
  rassegna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Leggi i feed RSS locali
        run: python3 scripts/sync_rassegna.py
      - name: Pubblica solo se ci sono notizie nuove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rassegna.json js/rassegna.js
          if git diff --cached --quiet; then
            echo "Nessuna novità: non pubblico."
          else
            git commit -m "Aggiorna la rassegna stampa locale"
            n=0
            while [ "$n" -lt 4 ]; do
              n=$((n + 1))
              git pull --rebase origin main && git push && exit 0
              echo "Push non riuscito, tentativo $n"
              sleep $((n * 4))
            done
            echo "Pubblicazione non riuscita dopo i tentativi"
            exit 1
          fi
