name: Rassegna stampa locale

on:
  schedule:
    # Ogni riga è un orario UTC. Lo script la traduce in ora di Roma (CET o CEST)
    # e parte solo alle 08:00, alle 12:00 e alle 18:00.
    - cron: "0 6 * * *"    # 08:00 ora legale
    - cron: "0 7 * * *"    # 08:00 ora solare
    - cron: "0 10 * * *"   # 12:00 ora legale
    - cron: "0 11 * * *"   # 12:00 ora solare
    - cron: "0 16 * * *"   # 18:00 ora legale
    - cron: "0 17 * * *"   # 18:00 ora solare
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rassegna-stampa
  cancel-in-progress: false

jobs:
  rassegna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Leggi i feed RSS locali
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RASSEGNA_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/sync_rassegna.py
      - name: Pubblica solo se ci sono notizie nuove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rassegna.json js/rassegna.js
          if git diff --cached --quiet; then
            echo "Nessuna novità: non pubblico."
          else
            git commit -m "Aggiorna la rassegna stampa locale"
            git push
          fi
