name: Aggiorna indice articoli

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "data/comuni.json"
      - "scripts/build_index.py"
      - ".github/workflows/indice-articoli.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indice-articoli
  cancel-in-progress: false

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rigenera js/articles.js
        run: python3 scripts/build_index.py
      - name: Pubblica l'indice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/articles.js
          if git diff --cached --quiet; then
            echo "Indice già allineato"
          else
            git commit -m "Aggiorna l'indice degli articoli"
            git push
          fi
