name: Sincronizza albi pretori

on:
  schedule:
    # Mezzanotte in Europa/Roma durante l'ora legale (CEST, UTC+2).
    - cron: "0 22 * * *"
    # Mezzanotte in Europa/Roma durante l'ora solare (CET, UTC+1).
    - cron: "0 23 * * *"
  workflow_dispatch:
  # Avvio una tantum: il push di questo file fa partire la prova.
  # Il trigger push viene tolto subito dopo, restano schedule e workflow_dispatch.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-albo.yml"

permissions:
  contents: write

concurrency:
  group: sync-albo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Leggi gli albi e aggiorna l'elenco
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALBO_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/sync_albo.py
      - name: Pubblica l'elenco
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albo.json js/albo.js
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Aggiorna gli atti degli albi pretori"
            git push
          fi
