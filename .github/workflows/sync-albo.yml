name: Sincronizza albi pretori

on:
  schedule:
    # Ogni riga è un orario UTC. Lo script la traduce in ora di Roma (CET o CEST)
    # e parte solo se cade su 00:00, 01:00, 02:30 o 04:00. La mezzanotte legge
    # tutti i comuni; gli orari successivi ritentano solo i falliti o vuoti.
    - cron: "0 22 * * *"   # 00:00 ora legale
    - cron: "0 23 * * *"   # 00:00 ora solare, oppure 01:00 ora legale
    - cron: "0 0 * * *"    # 01:00 ora solare
    - cron: "30 0 * * *"   # 02:30 ora legale
    - cron: "30 1 * * *"   # 02:30 ora solare
    - cron: "0 2 * * *"    # 04:00 ora legale
    - cron: "0 3 * * *"    # 04:00 ora solare
  workflow_dispatch:
    inputs:
      solo_zip:
        description: "Prepara solo lo zip dagli atti già salvati, senza rileggere gli albi"
        type: boolean
        default: false
      solo_email:
        description: "Solo email di prova"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-albo
  cancel-in-progress: false

jobs:
  leggi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Leggi gli albi e aggiorna l'elenco
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.solo_zip != 'true' && github.event.inputs.solo_email != 'true')
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALBO_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/sync_albo.py
      - name: Passa l'elenco al download
        if: github.event.inputs.solo_email != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: albo-lettura
          path: |
            data/albo.json
            js/albo.js
          if-no-files-found: error
      - name: Link dell'ultima Release
        if: github.event.inputs.solo_email == 'true'
        id: ultima
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ultima_release_albo.py
      - name: Invia email di prova
        if: github.event.inputs.solo_email == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_PROVA: "1"
          RELEASE_URL: ${{ steps.ultima.outputs.release_url }}
          ZIP_URL: ${{ steps.ultima.outputs.zip_url }}
        run: python3 scripts/invia_albo.py

  documenti:
    needs: leggi
    if: github.event.inputs.solo_email != 'true'
    # Chrome, non Python: Halley chiude il TLS in base all'impronta del client.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Chrome per i PDF Halley
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          sudo python3 -m playwright install-deps chromium
          google-chrome --version
      - name: Riprendi l'elenco letto
        uses: actions/download-artifact@v4
        with:
          name: albo-lettura
      - name: Prepara lo zip degli atti nuovi
        run: python3 scripts/pacchetto_albo.py
      - name: Pubblica la Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pubblica_release_albo.py
      - name: Invia lo zip per email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_PROVA: "0"
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          ZIP_URL: ${{ steps.release.outputs.zip_url }}
        run: python3 scripts/invia_albo.py
      - name: Pubblica l'elenco
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albo.json js/albo.js data/albo-pacchetto.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Aggiorna gli atti degli albi pretori"
            n=0
            while [ "$n" -lt 4 ]; do
              n=$((n + 1))
              git pull --rebase origin main && git push && exit 0
              echo "Push non riuscito, tentativo $n"
              sleep $((n * 4))
            done
            echo "Pubblicazione non riuscita dopo i tentativi"
            exit 1
          fi
