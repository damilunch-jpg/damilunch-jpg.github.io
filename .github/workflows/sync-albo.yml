name: Sincronizza albi pretori

on:
  schedule:
    # Ogni riga è un orario UTC. Lo script la traduce in ora di Roma (CET o CEST)
    # e parte solo se cade su 00:00, 01:00, 02:30 o 04:00. La mezzanotte legge
    # tutti i comuni; gli orari successivi ritentano solo i falliti o vuoti.
    - cron: "0 22 * * *"   # 00:00 ora legale
    - cron: "0 23 * * *"   # 00:00 ora solare, oppure 01:00 ora legale
    - cron: "0 0 * * *"    # 01:00 ora solare
    - cron: "30 0 * * *"   # 02:30 ora legale
    - cron: "30 1 * * *"   # 02:30 ora solare
    - cron: "0 2 * * *"    # 04:00 ora legale
    - cron: "0 3 * * *"    # 04:00 ora solare
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-albo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Leggi gli albi e aggiorna l'elenco
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALBO_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/sync_albo.py
      - name: Pubblica l'elenco
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albo.json js/albo.js
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Aggiorna gli atti degli albi pretori"
            git push
          fi
