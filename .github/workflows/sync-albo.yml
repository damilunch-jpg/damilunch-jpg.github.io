name: Sincronizza albi pretori

on:
  schedule:
    # Ogni riga è un orario UTC. Lo script la traduce in ora di Roma (CET o CEST)
    # e parte solo se cade su 00:00, 01:00, 02:30 o 04:00. La mezzanotte legge
    # tutti i comuni; gli orari successivi ritentano solo i falliti o vuoti.
    - cron: "0 22 * * *"   # 00:00 ora legale
    - cron: "0 23 * * *"   # 00:00 ora solare, oppure 01:00 ora legale
    - cron: "0 0 * * *"    # 01:00 ora solare
    - cron: "30 0 * * *"   # 02:30 ora legale
    - cron: "30 1 * * *"   # 02:30 ora solare
    - cron: "0 2 * * *"    # 04:00 ora legale
    - cron: "0 3 * * *"    # 04:00 ora solare
  workflow_dispatch:
    inputs:
      solo_zip:
        description: "Prepara solo lo zip dagli atti già salvati, senza rileggere gli albi"
        type: boolean
        default: false
      solo_email:
        description: "Solo email di prova"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-albo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Leggi gli albi e aggiorna l'elenco
        if: github.event_name != 'workflow_dispatch' || (github.event.inputs.solo_zip != 'true' && github.event.inputs.solo_email != 'true')
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALBO_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/sync_albo.py
      - name: Prepara lo zip degli atti nuovi
        if: github.event.inputs.solo_email != 'true'
        run: python3 scripts/pacchetto_albo.py
      - name: Pubblica la Release
        if: github.event.inputs.solo_email != 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pubblica_release_albo.py
      - name: Link dell'ultima Release
        if: github.event.inputs.solo_email == 'true'
        id: ultima
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ultima_release_albo.py
      - name: Invia lo zip per email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_PROVA: ${{ github.event.inputs.solo_email == 'true' && '1' || '0' }}
          RELEASE_URL: ${{ github.event.inputs.solo_email == 'true' && steps.ultima.outputs.release_url || steps.release.outputs.release_url }}
          ZIP_URL: ${{ github.event.inputs.solo_email == 'true' && steps.ultima.outputs.zip_url || steps.release.outputs.zip_url }}
        run: python3 scripts/invia_albo.py
      - name: Pubblica l'elenco
        if: github.event.inputs.solo_email != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/albo.json js/albo.js data/albo-pacchetto.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Aggiorna gli atti degli albi pretori"
            git push
          fi
