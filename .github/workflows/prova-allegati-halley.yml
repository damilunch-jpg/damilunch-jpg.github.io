name: Prova allegati Halley

# I giri di verifica sono già partiti. Non si rilancia da solo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scarica un allegato di prova per comune
        run: python3 scripts/pacchetto_albo.py --prova-halley
