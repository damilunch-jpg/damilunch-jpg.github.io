name: Notizie ufficiali del Movimento

on:
  schedule:
    # Ogni riga è un orario UTC. Lo script la traduce in ora di Roma (CET o CEST)
    # e parte solo alle 09:00 e alle 17:00.
    - cron: "0 7 * * *"    # 09:00 ora legale
    - cron: "0 8 * * *"    # 09:00 ora solare
    - cron: "0 15 * * *"   # 17:00 ora legale
    - cron: "0 16 * * *"   # 17:00 ora solare
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notizie-m5s
  cancel-in-progress: false

jobs:
  notizie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Leggi i feed ufficiali
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          M5S_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/sync_m5s.py
      - name: Pubblica solo se ci sono notizie nuove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/m5s.json js/m5s.js
          if git diff --cached --quiet; then
            echo "Nessuna novità: non pubblico."
          else
            git commit -m "Aggiorna le notizie ufficiali del Movimento"
            git push
          fi
